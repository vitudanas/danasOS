name: Publicar atualização do danasOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: danasos-pages
  cancel-in-progress: false

jobs:
  compilar:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Conferir assinatura e preparar somente os arquivos do canal
        env:
          DANASOS_APT_FINGERPRINT: ${{ vars.DANASOS_APT_FINGERPRINT }}
        run: |
          python3 verificar-canal.py publicacao "$RUNNER_TEMP/danasos-pages/apt" "$DANASOS_APT_FINGERPRINT"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/danasos-pages

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publicar canal
        id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
